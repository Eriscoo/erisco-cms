<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>403 Forbidden</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light dark}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:light-dark(#f7fafc,#111827);
}
.wrap{
  display:flex;
  align-items:center;
  padding:1rem 1.5rem;
}
.status{
  font-size:1.125rem;
  color:light-dark(#6b7280,#9ca3af);
  letter-spacing:.05em;
  padding-right:1rem;
  flex-shrink:0;
}
.sep{
  width:1px;
  height:2rem;
  background:light-dark(#cbd5e0,#4b5563);
  flex-shrink:0;
}
.label{
  font-size:1.125rem;
  color:light-dark(#6b7280,#9ca3af);
  text-transform:uppercase;
  letter-spacing:.05em;
  padding-left:1rem;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="status">403</div>
  <div class="sep"></div>
  <div class="label">Forbidden Access</div>
</div>
</body>
</html>
